name: Deployment
on:
  push:
    branches:
      - master
    paths:
      - '**'
  release:
    branches:
      - master
    types: [created]
    paths:
      - '**'

jobs:
  deployment:
    name: Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Compile current
        if: startsWith(github.ref, 'refs/tags/') != true
        run: |
          bash ./mvnw -B -ntp verify -f scripts/java/pom.xml -Dsoma.version=current

      - name: Compile tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash ./mvnw -B -ntp verify -f scripts/java/pom.xml "-Dsoma.version=${{ github.event.release.tag_name }}"

      - name: Upload SOMA
        uses: actions/upload-artifact@v1
        with:
          name: SOMA Ontology
          path: ./build/ci/dist/owl/SOMA.owl

      - name: Upload SOMA-HOME
        uses: actions/upload-artifact@v1
        with:
          name: SOMA-HOME Ontology
          path: ./build/ci/dist/owl/SOMA-HOME.owl

      - name: Upload DUL
        uses: actions/upload-artifact@v1
        with:
          name: DUL Ontology
          path: ./build/ci/dist/owl/DUL.owl

      - name: Compile NEEM Handbook
        uses: docker://blang/latex:ubuntu
        with:
          args: make -f ./docs/NEEM-handbook/Makefile
      
      - name: Copy NEEM Handbook
        run: sudo cp $GITHUB_WORKSPACE/docs/NEEM-handbook/main.pdf $GITHUB_WORKSPACE/build/ci/dist/files/NEEM-Handbook.pdf
      
      - name: Deploy files current
        uses: JamesIves/github-pages-deploy-action@releases/v3
        if: github.ref == 'refs/heads/master'
        with:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/ci/dist/files
          TARGET_FOLDER: /files/current

      - name: Deploy owl current
        uses: JamesIves/github-pages-deploy-action@releases/v3
        if: github.ref == 'refs/heads/master'
        with:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/ci/dist/owl/
          TARGET_FOLDER: /owl/current

      - name: Deploy owl tag
        uses: JamesIves/github-pages-deploy-action@releases/v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/ci/dist/owl/
          TARGET_FOLDER: owl/${{ github.event.release.tag_name }}
          #TARGET_FOLDER: owl/${{ GITHUB_REF/refs\/tags\// }}
          #TARGET_FOLDER: owl/${{ GITHUB_REF#refs/tags/ }}

      # Metrics have to be created after the deployment step, because 
      # OntoMetrics only allows POST with an URI at the moment
      - name: Metrics
        if: github.ref == 'refs/heads/master'
        run: |
          sudo ./scripts/OntoMetrics.sh \
          https://raw.githubusercontent.com/ease-crc/soma/gh-pages/owl/current/SOMA.owl \
          $GITHUB_WORKSPACE/build/ci/dist/files

      - name: Metrics
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo ./scripts/OntoMetrics.sh \
          https://raw.githubusercontent.com/ease-crc/soma/gh-pages/owl/${{ github.event.release.tag_name }}/SOMA.owl \
          $GITHUB_WORKSPACE/build/ci/dist/files

      - name: Upload Metrics
        uses: actions/upload-artifact@v1
        with:
          name: Metrics
          path: ./build/ci/dist/files/metrics.json

      - name: Deploy files current
        uses: JamesIves/github-pages-deploy-action@releases/v3
        if: github.ref == 'refs/heads/master'
        with:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/ci/dist/files
          TARGET_FOLDER: /files/current

      - name: Deploy files tag
        uses: JamesIves/github-pages-deploy-action@releases/v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/ci/dist/files/
          TARGET_FOLDER: files/${{ github.event.release.tag_name }}
          #TARGET_FOLDER: owl/${{ GITHUB_REF/refs\/tags\// }}
          #TARGET_FOLDER: owl/${{ GITHUB_REF#refs/tags/ }}

      - name: Deploy failure
        if: failure()
        run: echo Deployment failed. If the other steps succeeded, maybe no ACCESS_TOKEN was set?
