name: Documentation
on:
  workflow_run:
    workflows: ["Evaluation"]
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: documentation-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  vocabulary:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: SOMA Vocabulary
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download OWL file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./build/ci/dist/owl
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: SOMA OWL

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-extra texlive-extra-utils texlive-fonts-recommended
          python -m pip install -r .github/requirements-docs.txt

      - name: Build vocabulary
        run: |
          cp docs/vocab/Makefile docs/vocab/SOMA-vocabulary.tex docs/vocab/owl_reader.py .
          make

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SOMA Vocabulary
          path: ./SOMA-vocabulary.pdf
          retention-days: 7
          if-no-files-found: error

  handbook:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: NEEM Handbook
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science

      - name: Build handbook
        run: make -f docs/NEEM-handbook/Makefile

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NEEM Handbook
          path: ./docs/NEEM-handbook/main.pdf
          retention-days: 7
          if-no-files-found: error
