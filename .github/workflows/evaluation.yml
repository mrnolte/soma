name: Evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!docs/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
  release:
    types: [created]
    paths:
      - '**'
      - '!docs/**'

jobs:
  compile:
    name: Compile SOMA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Compile
        run: |
          bash ./mvnw -B -ntp verify -f scripts/java/pom.xml -Dsoma.version=current

      - name: Upload reasoner inputs
        uses: actions/upload-artifact@v4
        with:
          name: SOMA Reasoner Inputs
          path: ./build/ci/work/

      - name: Upload processing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOMA Processing Reports
          path: |
            ./build/ci/reports/
            ./build/ci/manifest.json

      - name: Upload OWL file
        uses: actions/upload-artifact@v4
        with:
          name: SOMA OWL
          path: ./build/ci/dist/owl/

      - name: Upload OWL files for Documentation
        uses: actions/upload-artifact@v4
        with:
          name: SOMA Files for Documentation
          path: ./build/ci/dist/owl/
          retention-days: 2

  pitfalls:
    name: OOPS
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: SOMA OWL
          path: ./build/ci/dist/owl/

      - name: Create report directory
        run: mkdir -p ./build/ci/reports

      - name: Setup Python
        uses: actions/setup-python@v2

      - name: Install python dependencies
        run: |
          sudo python -m pip install --upgrade pip
          sudo pip install requests

      - name: Find pitfalls
        run: sudo python ./scripts/oops.py $GITHUB_WORKSPACE/build/ci/dist/owl/SOMA-HOME.owl $GITHUB_WORKSPACE/build/ci/reports

      - name: Generate annotations
        run: sudo python ./scripts/oops-github.py $GITHUB_WORKSPACE/build/ci/reports/oops.xml

      - name: Upload pitfalls
        uses: actions/upload-artifact@v1
        with:
          name: OOPS Results
          path: ./build/ci/reports/oops.xml

  consistency:
    name: HermiT
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: SOMA Reasoner Inputs
          path: ./build/ci/work

      - name: Create report directory
        run: mkdir -p ./build/ci/reports

      - name: HermiT
        uses: ./.github/actions/hermit
        with:
          args: ./build/ci/work/SOMA-HOME.owl

      - name: Print HermiT output
        run: cat ./hermit.output
        if: always()

      - name: Evaluate HermiT output
        if: success()
        uses: docker://python:3.7.6-slim
        with:
          args: python ./scripts/hermit_test.py -o ./build/ci/reports/hermit.html ./hermit.output

