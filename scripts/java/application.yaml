ontology:
  directory: ../../owl/
  output-directory: ../../build/ci/
  format: rdf_xml
  transformations:
    rewrite-gci: true
    rewrite-iri: false
    is-defined-by: true
    version-info: true
  to-collapse:
    - ontology: http://www.ease-crc.org/ont/SOMA-All.owl
      out-path: SOMA.owl
      except: [http://www.ease-crc.org/ont/DUL.owl]
      new-iri: http://www.ease-crc.org/ont/SOMA.owl
    - ontology: http://www.ease-crc.org/ont/SOMA-HOME.owl
      out-path: SOMA-HOME.owl
      except: [http://www.ease-crc.org/ont/DUL.owl, http://www.ease-crc.org/ont/SOMA.owl]
